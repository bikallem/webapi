  <text x="72" y="298" fill="#eef0f5" font-size="182" font-weight="800" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" letter-spacing="-7">webapi</text>
  <text x="84" y="406" fill="#e09030" font-size="80" font-weight="700" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" letter-spacing="-2">v0.4.0</text>
