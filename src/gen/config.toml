    "fullscreen",
    "screen-orientation",
    "storage",
    "resize-observer",
    "selection-api",
    "intersection-observer",
    "pointerevents",
    "touch-events",
    "clipboard-apis",
    "websockets",
    "encoding",
    "notifications",
    "vibration",
    "streams",
    "web-animations",
    "IndexedDB",
    "permissions",
    "service-workers",
