<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" href="data:," />
    <title>externref bug minimal repro (wasm-gc)</title>
</head>
<body>
    <div id="app">
        <p>Open DevTools console. If you see a <code>WebAssembly.instantiate()</code>
        error about <code>fallthru</code> / <code>externref</code>, the bug is confirmed.</p>
        <p>This is a <strong>minimal</strong> reproduction — no library, no <code>unsafe_cast</code>.
        Just <code>#external</code> type + trait with supertrait → trait object.</p>
    </div>
    <script type="module">
        try {
            const { instance } = await WebAssembly.instantiateStreaming(
                fetch("../_build/wasm-gc/release/build/externref-bug-minimal/externref-bug-minimal.wasm"),
                { env: { make_foo: () => ({}) } },
                { builtins: ["js-string"], importedStringConstants: "_" }
            );
            instance.exports._start();
            document.getElementById("app").innerHTML +=
                `<pre style="color:green">Success — bug is fixed!</pre>`;
        } catch (e) {
            document.getElementById("app").innerHTML +=
                `<pre style="color:red;white-space:pre-wrap">BUG CONFIRMED: ${e.message}</pre>`;
            console.error(e);
        }
    </script>
</body>
</html>
