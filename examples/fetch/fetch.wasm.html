<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" href="data:," />
    <title>Fetch Example (wasm-gc)</title>
    <style>
        body {
            font-family: system-ui;
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
        }

        button {
            padding: 0.5em 1em;
            font-size: 1em;
            margin: 0.25em;
        }

        pre {
            background: #f5f5f5;
            padding: 1em;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>

<body>
    <div id="app"></div>
    <script type="module">
        import { wasmImportObject } from "../../src/webapi.mjs";
        const { instance } = await WebAssembly.instantiateStreaming(
            fetch("../_build/wasm-gc/release/build/fetch/fetch.wasm"),
            wasmImportObject,
            { builtins: ["js-string"], importedStringConstants: "_" }
        );
        instance.exports._start();
    </script>
</body>

</html>
