<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" href="data:," />
    <title>Canvas Demo (wasm-gc)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        h1 {
            margin-bottom: 1.5rem;
            font-weight: 300;
            letter-spacing: 2px;
        }

        #app {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        canvas {
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .info {
            color: #888;
            font-size: 0.9rem;
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <h1>Canvas Demo</h1>
    <div id="app"></div>
    <p class="info">Rendered with MoonBit WebAPI + Canvas 2D API (wasm-gc)</p>
    <script type="module">
        import { wasmImportObject } from "../../src/webapi.mjs";

        const wasmPath = "../target/wasm-gc/release/build/canvas/canvas.wasm";
        const { instance } = await WebAssembly.instantiateStreaming(
            fetch(wasmPath),
            wasmImportObject,
            {
                builtins: ["js-string"],
                importedStringConstants: "_",
            }
        );
        instance.exports._start();
    </script>
</body>

</html>
