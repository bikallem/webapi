<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" href="data:," />
    <title>Canvas Demo (wasm-gc)</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        h1 {
            font-weight: 300;
            letter-spacing: 2px;
        }

        #app {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        canvas {
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .info {
            color: #888;
            font-size: 0.9rem;
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <h1>Canvas Demo</h1>
    <div id="app"></div>
    <p class="info">Rendered with MoonBit WebAPI + Canvas 2D API (wasm-gc)</p>
    <script type="module">
        import { wasmImportObject } from "../_build/wasm-gc/release/build/canvas/webapi.mjs";

        const wasmPath = "../_build/wasm-gc/release/build/canvas/canvas.wasm";
        const { instance } = await WebAssembly.instantiateStreaming(
            fetch(wasmPath),
            wasmImportObject,
            {
                builtins: ["js-string"],
                importedStringConstants: "_",
            }
        );
        instance.exports._start();
    </script>
</body>

</html>
