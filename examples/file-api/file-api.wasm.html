<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" href="data:," />
    <link rel="stylesheet" href="../styles.css">
    <title>File API Example (wasm-gc)</title>
</head>
<body>
    <div id="app"></div>
    <script type="module">
        import { wasmImportObject } from "../../src/webapi.mjs";
        wasmImportObject.webapi_FileApiExample = {
            createTextBlob: (text, mime) => new Blob([text], { type: mime }),
            createTextFile: (text, name, mime) => new File([text], name, { type: mime }),
            resultToString: (r) => r,
        };
        const { instance } = await WebAssembly.instantiateStreaming(
            fetch("../_build/wasm-gc/release/build/file-api/file-api.wasm"),
            wasmImportObject,
            { builtins: ["js-string"], importedStringConstants: "_" }
        );
        instance.exports._start();
    </script>
</body>
</html>
