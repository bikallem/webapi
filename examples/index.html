<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>MoonBit WebAPI Examples</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; display: flex; height: 100vh; overflow: hidden; background: #fff; color: #333; }

        .sidebar {
            width: 280px; min-width: 280px;
            background: #f7f8fa;
            border-right: 1px solid #e2e5ea;
            display: flex; flex-direction: column;
            overflow-y: auto;
        }
        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: #ccc; border-radius: 2px; }

        .brand {
            padding: 1.4rem 1.2rem 1rem;
            border-bottom: 1px solid #e2e5ea;
        }
        .brand h1 {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: #999;
        }
        .brand .title {
            font-size: 1.15rem;
            font-weight: 500;
            color: #222;
            margin-top: 0.2rem;
        }

        .sidebar ul { list-style: none; padding: 0.4rem 0; }
        .sidebar li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.45rem 1.2rem;
            transition: background 0.15s;
        }
        .sidebar li:hover { background: #eef0f4; }

        .name {
            font-size: 0.88rem;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .targets {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
            margin-left: 0.75rem;
        }
        .targets a {
            font-size: 0.68rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-decoration: none;
            padding: 2px 7px;
            border-radius: 3px;
            transition: all 0.15s;
            cursor: pointer;
        }
        .targets a.t-js {
            color: #8a7a00;
            background: #fdf6d8;
            border: 1px solid #ede4a6;
        }
        .targets a.t-js:hover, .targets a.t-js.active {
            background: #f5ea9e;
            border-color: #d4c85a;
        }
        .targets a.t-wasm {
            color: #4a3ab5;
            background: #eeebfc;
            border: 1px solid #d6d0f5;
        }
        .targets a.t-wasm:hover, .targets a.t-wasm.active {
            background: #dad4f7;
            border-color: #a89ae8;
        }
        .targets a.t-src {            
            background: none;
            border: none;
            font-size: 0.58rem;
            padding: 2px 3px;
            text-transform: none;
        }
        .targets a.t-src:hover {
            color: #555;
        }

        #app { display: contents; }
        .content { flex: 1; background: #fff; }
        .content iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <div id="app"></div>
    <script>if (!location.pathname.endsWith('/')) location.replace(location.pathname + '/' + location.hash);</script>
    <script type="module" src="../_build/js/release/build/bikallem/webapi-examples/webapi-examples.js"></script>
</body>
</html>
