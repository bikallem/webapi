name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-test-webapi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        working-directory: webapi_gen
        run: npm ci

      - name: Install MoonBit dependencies
        run: |
          moon version --all
          moon update

      - name: Check (JS target)
        run: moon check --target js

      - name: Check (wasm-gc target)
        run: moon check --target wasm-gc

      - name: Run tests
        working-directory: webapi_gen
        run: moon test

      - name: Build examples (JS)
        working-directory: examples
        run: moon build --target js --release

      - name: Build examples (wasm-gc)
        working-directory: examples
        run: moon build --target wasm-gc --release

      - name: Install Playwright dependencies
        working-directory: tests
        run: |
          npm ci
          npx playwright install chromium

      - name: Run Playwright tests
        working-directory: tests
        run: npx playwright test --workers 2

      - name: Prepare site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p _site/src
          cp -rL examples _site/examples
          rm -rf _site/examples/.mooncakes _site/examples/_build
          cp src/webapi.mjs _site/src/
          echo '<meta http-equiv="refresh" content="0; url=examples/">' > _site/index.html

      - name: Setup Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-test-webapi
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
