name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-test-webapi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            webapi_gen/package-lock.json
            tests/package-lock.json

      - name: Install npm dependencies
        working-directory: webapi_gen
        run: npm ci

      - name: Cache MoonBit packages
        uses: actions/cache@v4
        with:
          path: |
            .mooncakes
            webapi_gen/.mooncakes
            examples/.mooncakes
          key: mooncakes-${{ runner.os }}-${{ hashFiles('moon.mod.json', 'webapi_gen/moon.mod.json', 'examples/moon.mod.json') }}

      - name: Install MoonBit dependencies
        run: |
          moon version --all
          moon update

      - name: Check (JS target)
        run: moon check --target js

      - name: Check (wasm-gc target)
        run: moon check --target wasm-gc

      - name: Run tests
        working-directory: webapi_gen
        run: moon test

      - name: Build examples (JS)
        working-directory: examples
        run: moon build --target js --release

      - name: Build examples (wasm-gc)
        working-directory: examples
        run: moon build --target wasm-gc --release

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/package-lock.json') }}

      - name: Install Playwright dependencies
        working-directory: tests
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Debug serve
        working-directory: tests
        run: |
          npx serve .. -l 3000 --no-clipboard --no-request-logging --symlinks &
          sleep 3
          echo "=== symlink check ==="
          ls -la ../examples/target
          echo "=== curl JS ==="
          curl -s -o /dev/null -w "status: %{http_code}, type: %{content_type}\n" http://localhost:3000/examples/target/js/release/build/canvas/canvas.js
          echo "=== curl HTML ==="
          curl -s -o /dev/null -w "status: %{http_code}, type: %{content_type}\n" http://localhost:3000/examples/canvas/canvas.js.html
          echo "=== curl JS first 200 chars ==="
          curl -s http://localhost:3000/examples/target/js/release/build/canvas/canvas.js | head -c 200
          echo ""
          echo "=== curl wasm ==="
          curl -s -o /dev/null -w "status: %{http_code}, type: %{content_type}\n" http://localhost:3000/examples/target/wasm-gc/release/build/canvas/canvas.wasm
          echo "=== curl webapi.mjs ==="
          curl -s -o /dev/null -w "status: %{http_code}, type: %{content_type}\n" http://localhost:3000/src/webapi.mjs
          kill %1 2>/dev/null

      - name: Run Playwright tests
        working-directory: tests
        run: npx playwright test

      - name: Prepare site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p _site/src
          cp -r examples _site/examples
          rm -rf _site/examples/.mooncakes _site/examples/_build _site/examples/target
          mkdir -p _site/examples/target/js/release _site/examples/target/wasm-gc/release
          cp -rL examples/target/js/release/build _site/examples/target/js/release/
          cp -rL examples/target/wasm-gc/release/build _site/examples/target/wasm-gc/release/
          cp src/webapi.mjs _site/src/
          echo '<meta http-equiv="refresh" content="0; url=examples/">' > _site/index.html

      - name: Setup Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-test-webapi
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
