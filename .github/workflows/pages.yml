# Deploy examples to GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Install MoonBit dependencies
        run: |
          moon version --all
          moon update

      - name: Build examples (JS)
        working-directory: examples
        run: moon build --target js --release

      - name: Build examples (wasm-gc)
        working-directory: examples
        run: moon build --target wasm-gc --release

      - name: Prepare site
        run: |
          mkdir -p _site/src
          cp -rL examples _site/examples
          rm -rf _site/examples/.mooncakes _site/examples/_build
          cp src/webapi.mjs _site/src/
          echo '<meta http-equiv="refresh" content="0; url=examples/">' > _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
